[project]
name = "newsdedup"
version = "1.0.1"
description = "A project to deduplicate news feed articles"
authors = [
    {name = "PR", email = "code@reuteras.se"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "rapidfuzz>=3.14.5",
    "miniflux>=0.0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.16.1",
]

[project.scripts]
newsdedup = "newsdedup:main"
unstar = "unstar:main"
list-feeds = "list_feeds:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM", "PL"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "T201",    # Print statements (intentional for CLI)
    "BLE001",  # Blind exception catches (intentional for robustness)
    "C901",    # Function complexity (main functions are intentionally complex)
    "PERF203", # try-except in loop (intentional for main loop error handling)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

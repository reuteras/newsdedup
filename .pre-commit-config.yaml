repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2 # v0.16.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run inside the project's own uv-managed venv so mypy sees the
        # exact dependency versions pinned in uv.lock instead of a
        # separately resolved isolated environment.
        entry: uv run --extra dev mypy .
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/betterleaks/betterleaks
    rev: 82b306a9d338121a6fd087002a94e5c7ab685355 # v1.7.3
    hooks:
      - id: betterleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  - repo: local
    hooks:
      - id: markdown-table-formatter
        name: markdown-table-formatter
        entry: npx markdown-table-formatter
        language: node
        types: [markdown]
        additional_dependencies: ["markdown-table-formatter@1.6.1"]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run inside the project's own uv-managed venv so mypy sees the
        # exact dependency versions pinned in uv.lock instead of a
        # separately resolved isolated environment.
        entry: uv run --extra dev mypy .
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac # v1.9.0
    hooks:
      - id: betterleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint

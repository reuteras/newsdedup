repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c # v0.16.7
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run inside the project's own uv-managed venv so mypy sees the
        # exact dependency versions pinned in uv.lock instead of a
        # separately resolved isolated environment.
        entry: uv run --extra dev mypy .
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/betterleaks/betterleaks
    rev: 5eab48332cc48565864514e3bc6de89df091a7c4 # v1.8.1
    hooks:
      - id: betterleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
